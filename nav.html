<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <!--  Navbar Section start -->
    <header class="w-full bg-gradient-to-b from-[#BAC5FE] via-[#E8EAFF] to-white pb-20">
        <!-- nav-start -->
        <nav class="py-6 px-6 border border-red-800">
            <div class="container mx-auto flex justify-between items-center">
                <!-- Masters Hub -->
                <a href="#" class="flex items-center gap-1">
                    <span class="text-xl font-extrabold text-white">MH.</span>
                    <span class="text-xl font-medium text-white/90">Masters Hub</span>
                </a>

                <!-- Nav_items -->
                <div class="hidden lg:flex items-center gap-8">
                    <a href="#"
                        class="text-sm font-medium text-indigo-800/80 hover:text-indigo-900 transition-colors">Create
                        Resume</a>
                    <a href="#"
                        class="text-sm font-medium text-indigo-800/80 hover:text-indigo-900 transition-colors">Skillset</a>
                    <a href="#"
                        class="text-sm font-medium text-indigo-800/80 hover:text-indigo-900 transition-colors">Partnered
                        Job Board</a>
                    <a href="#"
                        class="text-sm font-medium text-indigo-800/80 hover:text-indigo-900 transition-colors">Contact
                        Us</a>
                </div>

                <!-- Register Now -->
                <div class="flex items-center">
                    <a href="#"
                        class="group flex items-center gap-4 border border-white-100 bg-white-100 hover:bg-gray-200 hover:text-indigo-500 text-white rounded-full pl-6 pr-2 py-2 transition-all ">
                        <span class="text-sm font-medium">Register Now</span>
                        <div
                            class="w-8 h-8 bg-white rounded-full flex items-center justify-center text-indigo-600 shadow-md">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                                stroke="currentColor"
                                class="w-4 h-4 transform group-hover:-rotate-45 transition-transform duration-300">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3" />
                            </svg>

                        </div>
                    </a>
                </div>

            </div>
        </nav>
        <!-- nav-end -->

        <!-- Showcase Your Mastery. -->
        <div class=" max-w-4xl mx-auto text-center px-6 mt-12 sm:mt-16">
            <div class="flex justify-center">
                <div class="flex w-fit items-center gap-2 bg-gray-100 rounded-full px-5 py-2 mb-8 border border-gray-100">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="size-6">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M15.75 10.5V6a3.75 3.75 0 1 0-7.5 0v4.5m11.356-1.993 1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 0 1-1.12-1.243l1.264-12A1.125 1.125 0 0 1 5.513 7.5h12.974c.576 0 1.059.435 1.119 1.007ZM8.625 10.5a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm7.5 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
                    </svg>
                    <span class="text-xs sm:text-sm font-medium text-slate-700">Your #1 Platform for Skill Sharing</span>
                </div>
            </div>

            <h1 class="text-4xl sm:text-5xl md:text-6xl font-semibold text-[#0f2d69]  mb-6">
                Showcase Your Mastery.<br>Get Connected
            </h1>

            <p class="text-sm sm:text-base text-slate-600 max-w-lg mx-auto mb-10 ">
                Create your profile, showcase your skills, and let employers find you.
            </p>

            <!-- e.g. UX DesignerUX & e.g. Liverpool, USA -->
            <div
                class="max-w-2xl mx-auto bg-white p-2 rounded-2xl sm:rounded-full shadow-lg border border-slate-100 flex flex-col sm:flex-row items-center gap-2">
                <div
                    class="flex   items-center gap-2 pl-4 py-2 w-full border-b sm:border-b-0 sm:border-r border-slate-100">
                    <svg class="w-5 h-5 text-slate-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                    <input type="text" placeholder="e.g. UX DesignerUX"
                        class="w-full text-sm text-slate-800 outline-none bg-transparent">
                </div>

                <div class="flex  items-center gap-2 pl-4 py-2 w-full">
                    <svg class="w-5 h-5 text-slate-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z">
                        </path>
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z"></path>
                    </svg>
                    <input type="text" placeholder="e.g. Liverpool, USA"
                        class="w-full text-sm text-slate-800 outline-none bg-transparent">
                </div>

                <button
                    class="w-full sm:w-auto bg-indigo-400 hover:bg-indigo-500 text-white text-sm font-medium px-8 py-3 rounded-full transition-colors shrink-0">
                    Search
                </button>
            </div>

        </div>
    </header>
    <!-- Navbar Section end  -->
</body>
</html>
